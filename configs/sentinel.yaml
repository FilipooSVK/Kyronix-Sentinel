daemon:
  interval: 30s

host:
  environment: ""
  role: ""

metrics:
  enabled: false
  listen_address: 127.0.0.1:19130

history:
  size: 1000
  persistence: true
  path: /var/lib/sentinel/history.jsonl

logging:
  level: info

update:
  enabled: true
  owner: ""
  repository: ""
  auto_check: true
  auto_install: false
  check_interval: 24h
